[project]
name = "studyforge-backend"
version = "2.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["B008", "B905", "UP046", "UP047"]  # B008: FastAPI Depends() defaults are idiomatic; B905: zip strict noise

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
