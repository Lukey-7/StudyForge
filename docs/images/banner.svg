<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">StudyForge</title>
  <desc id="d">Drop in your course. Get a book that grows with it, where every paragraph points at its source.</desc>
  <defs>
    <pattern id="ruled" width="1280" height="34" patternUnits="userSpaceOnUse">
      <line x1="0" y1="33.5" x2="1280" y2="33.5" stroke="#ECE9DF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="30%" r="70%">
      <stop offset="0" stop-color="#24302B"/>
      <stop offset="1" stop-color="#1A2320"/>
    </radialGradient>
  </defs>

  <!-- the chalkboard -->
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="340" rx="18" fill="url(#ruled)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="17.5" fill="none" stroke="#ECE9DF" stroke-opacity="0.12"/>

  <!-- wordmark + tagline -->
  <g font-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <text x="72" y="118" fill="#ECE9DF" font-size="68" font-weight="800" letter-spacing="-1.5">StudyForge</text>
    <text x="74" y="176" fill="#9DA69D" font-size="28" font-weight="500">Drop in your course. Get
      <tspan fill="#F4D35E" font-weight="700" text-decoration="underline">a book that grows with it</tspan>.</text>
    <text x="74" y="216" fill="#9DA69D" font-size="22">Every paragraph points at the page it came from.</text>

    <!-- feature chips -->
    <g font-size="17" font-weight="600" fill="#ECE9DF">
      <rect x="72" y="252" width="176" height="40" rx="20" fill="#2E3B35" stroke="#ECE9DF" stroke-opacity="0.18"/>
      <text x="160" y="278" text-anchor="middle">Knowledge map</text>
      <rect x="260" y="252" width="150" height="40" rx="20" fill="#2E3B35" stroke="#ECE9DF" stroke-opacity="0.18"/>
      <text x="335" y="278" text-anchor="middle">Cited book</text>
      <rect x="422" y="252" width="176" height="40" rx="20" fill="#2E3B35" stroke="#ECE9DF" stroke-opacity="0.18"/>
      <text x="510" y="278" text-anchor="middle">Support check</text>
      <rect x="610" y="252" width="190" height="40" rx="20" fill="#2E3B35" stroke="#ECE9DF" stroke-opacity="0.18"/>
      <text x="705" y="278" text-anchor="middle">Chat with sources</text>
      <rect x="812" y="252" width="180" height="40" rx="20" fill="#2E3B35" stroke="#ECE9DF" stroke-opacity="0.18"/>
      <text x="902" y="278" text-anchor="middle">16 study tools</text>
    </g>
  </g>

  <!-- a page of the book, with its evidence rail -->
  <g transform="translate(1040 52)">
    <rect width="170" height="220" rx="10" fill="#F1ECDD"/>
    <line x1="30" y1="0" x2="30" y2="220" stroke="#E07A6A" stroke-opacity="0.7"/>
    <g stroke="#4E5852" stroke-width="5" stroke-linecap="round" stroke-opacity="0.55">
      <line x1="44" y1="34" x2="140" y2="34"/>
      <line x1="44" y1="54" x2="150" y2="54"/>
      <line x1="44" y1="74" x2="118" y2="74"/>
      <line x1="44" y1="120" x2="148" y2="120"/>
      <line x1="44" y1="140" x2="132" y2="140"/>
      <line x1="44" y1="160" x2="150" y2="160"/>
      <line x1="44" y1="180" x2="104" y2="180"/>
    </g>
    <!-- the highlighter stroke on paper -->
    <rect x="40" y="46" width="114" height="14" rx="3" fill="#F4D35E" fill-opacity="0.55"/>
    <!-- citation marks -->
    <rect x="-22" y="44" width="30" height="18" rx="4" fill="#F4D35E"/>
    <text x="-7" y="57" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#1A2320">S1</text>
    <rect x="-22" y="150" width="30" height="18" rx="4" fill="#F4D35E"/>
    <text x="-7" y="163" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#1A2320">B2</text>
  </g>
</svg>
